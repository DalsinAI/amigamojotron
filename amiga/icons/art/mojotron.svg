<?xml version="1.0" encoding="UTF-8"?>
<!-- Mojotron's GlowIcon art: the hero in the arena, firing at a robot.
     The AmiCradle Team's own drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#3a1458"/><stop offset="1" stop-color="#0b0418"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ecf5"/><stop offset="1" stop-color="#6b7488"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="10" fill="url(#bg)" stroke="#ff3fa0" stroke-width="3"/>
  <!-- robot, top right -->
  <g transform="translate(74 18)">
    <rect x="4" y="0" width="28" height="22" rx="4" fill="url(#metal)" stroke="#1d2233" stroke-width="2"/>
    <rect x="9" y="7" width="7" height="6" fill="#ff2a2a"/><rect x="20" y="7" width="7" height="6" fill="#ff2a2a"/>
    <rect x="0" y="24" width="36" height="20" rx="3" fill="url(#metal)" stroke="#1d2233" stroke-width="2"/>
    <rect x="6" y="46" width="8" height="10" fill="#6b7488"/><rect x="22" y="46" width="8" height="10" fill="#6b7488"/>
  </g>
  <!-- shots -->
  <g stroke="#ffe14a" stroke-width="4" stroke-linecap="round">
    <line x1="50" y1="74" x2="58" y2="66"/><line x1="63" y1="61" x2="71" y2="53"/>
  </g>
  <!-- hero, bottom left -->
  <g transform="translate(22 66)">
    <circle cx="16" cy="9" r="8" fill="#ffd2a6" stroke="#3b1d0a" stroke-width="2"/>
    <rect x="6" y="18" width="20" height="18" rx="4" fill="#2fd27a" stroke="#0d3a20" stroke-width="2"/>
    <rect x="22" y="16" width="14" height="6" rx="2" fill="#c9cfd9" stroke="#1d2233" stroke-width="1.5" transform="rotate(-45 22 19)"/>
    <rect x="8" y="37" width="6" height="12" fill="#2a5bd7"/><rect x="18" y="37" width="6" height="12" fill="#2a5bd7"/>
  </g>
  <!-- fruit -->
  <circle cx="100" cy="100" r="6" fill="#ff5a3c" stroke="#5a1408" stroke-width="1.5"/>
  <circle cx="86" cy="106" r="5" fill="#ffd23c" stroke="#5a4208" stroke-width="1.5"/>
</svg>
